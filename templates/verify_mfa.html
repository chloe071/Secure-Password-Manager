{% extends "base.html" %}{% block title %}Verify MFA{% endblock %}
{% block content %}
<h1>Two-factor verification</h1>
<form method="POST" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>6-digit code <input name="token" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" autofocus required></label>
  <button type="submit">Verify</button>
</form>
{% endblock %}
